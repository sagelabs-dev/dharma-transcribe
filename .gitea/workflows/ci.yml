name: Gitea CI
# Gitea-native CI. Runner labels: self-hosted,linux,docker.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: self-hosted
    container:
      image: python:3.12
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 "http://guan:${{ github.token }}@gitea:3000/guan/dharma-transcribe.git" .repo
      - name: Install
        working-directory: .repo
        run: pip install ruff
      - name: Ruff check
        working-directory: .repo
        run: ruff check src/ tests/
      - name: Ruff format
        working-directory: .repo
        run: ruff format --check src/ tests/
  typecheck:
    runs-on: self-hosted
    container:
      image: python:3.12
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 "http://guan:${{ github.token }}@gitea:3000/guan/dharma-transcribe.git" .repo
      - name: Install
        working-directory: .repo
        run: pip install mypy
      - name: Mypy
        working-directory: .repo
        run: mypy src/dharma_transcribe/
  test:
    runs-on: self-hosted
    container:
      image: python:3.12
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 "http://guan:${{ github.token }}@gitea:3000/guan/dharma-transcribe.git" .repo
      - name: Install
        working-directory: .repo
        run: pip install -e ".[dev]"
      - name: Pytest
        working-directory: .repo
        run: pytest tests/ --ignore=tests/test_e2e.py
