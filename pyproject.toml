[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dharma-transcribe"
version = "0.1.2"
description = "Headless multilingual transcription pipeline for Buddhist dharma teachings"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "David Newman & Guan", email = "david.r.newman@proton.me" },
]
keywords = [
    "transcription", "whisper", "whisperx", "tibetan", "sanskrit",
    "buddhist", "dharma", "asr", "speech-to-text", "multilingual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Religion",
]
dependencies = [
    "whisperx>=3.8.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.40",
    "openai>=1.0",
    "tiktoken>=0.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
dharma-transcribe = "dharma_transcribe.cli:main"

[project.urls]
Homepage = "https://github.com/guan-tends/dharma-transcribe"
Repository = "https://github.com/guan-tends/dharma-transcribe"

[tool.hatch.build.targets.wheel]
packages = ["src/dharma_transcribe"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
files = ["src/dharma_transcribe"]

[tool.coverage.run]
source = ["dharma_transcribe"]
omit = ["tests/*"]
